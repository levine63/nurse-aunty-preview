<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>North India Draft Graphics Gallery</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f1ea; color: #222; }
    main { padding: 24px; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0 0 18px; color: #555; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    figure { margin: 0; background: white; border: 1px solid #d8d0c1; border-radius: 8px; padding: 10px; }
    img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #fffaf0; border-radius: 6px; }
    figcaption { padding-top: 8px; font-size: 13px; font-weight: 700; }
    .note { display: block; margin-top: 3px; font-size: 11px; font-weight: 400; color: #666; }
  </style>
</head>
<body>
  <main>
    <h1>North India Draft Graphics</h1>
    <p>Prototype SVGs, $0 spend, review-gated. These are placeholders for local/clinical review, not final field art.</p>
    <section class="grid">
      <figure><img src="north_india_child_triage_rr.svg" alt=""><figcaption>Child triage / breathing count<span class="note">Clinic courtyard, caregiver, child, CHW, timer.</span></figcaption></figure>
      <figure><img src="north_india_ors_zinc.svg" alt=""><figcaption>ORS + zinc<span class="note">Kitchen table, clean water, cup, packet placeholders.</span></figcaption></figure>
      <figure><img src="north_india_dental.svg" alt=""><figcaption>Dental<span class="note">Child, caregiver, toothbrush, timer, clinic cue.</span></figcaption></figure>
      <figure><img src="north_india_wash_home.svg" alt=""><figcaption>WASH home<span class="note">Hand pump, covered water, soap, boiling pot.</span></figcaption></figure>
      <figure><img src="north_india_maternal_visits.svg" alt=""><figcaption>Maternal/newborn visits<span class="note">Clinic doorway, mother/baby, CHW, calendar.</span></figcaption></figure>
      <figure><img src="north_india_delivery_kit.svg" alt=""><figcaption>Delivery kit<span class="note">Clean cloths, documents, phone contact, transport.</span></figcaption></figure>
      <figure><img src="north_india_menstrual_private.svg" alt=""><figcaption>Menstrual private module<span class="note">Private wash corner, supplies, calendar, shield.</span></figcaption></figure>
      <figure><img src="north_india_hearing_school.svg" alt=""><figcaption>Hearing / school health<span class="note">School room, child, caregiver, sound cue.</span></figcaption></figure>
      <figure><img src="north_india_household_checklist.svg" alt=""><figcaption>Household checklist<span class="note">Clinic contact, medicines, water, transport, review.</span></figcaption></figure>
    </section>
  </main>
</body>
</html>
